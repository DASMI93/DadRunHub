<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b2438"/>
      <stop offset="60%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    
    <linearGradient id="orangeGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fc5200" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fc5200" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="bellMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="40%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <linearGradient id="bodySkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2a77f"/>
      <stop offset="100%" stop-color="#c5835c"/>
    </linearGradient>

    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3347"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGlow)"/>

  <!-- Tech Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="900" y1="0" x2="900" y2="1000"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
  </g>

  <!-- Ground Plane Perspective -->
  <polygon points="150,920 850,920 950,990 50,990" fill="#0b101a" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <ellipse cx="500" cy="920" rx="220" ry="25" fill="#000" opacity="0.5"/>

  <!-- Title Header -->
  <text x="70" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">CLEAN &amp; PUSH PRESS</text>
  <text x="70" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#fc5200" letter-spacing="3">12KG · PROPER FORM GUIDE</text>
  <line x1="70" y1="140" x2="220" y2="140" stroke="#fc5200" stroke-width="3"/>

  <!-- Badge Top Right -->
  <rect x="800" y="60" width="130" height="42" rx="10" fill="#151d2f" stroke="rgba(252,82,0,0.4)" stroke-width="1.5"/>
  <text x="865" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#fc5200" text-anchor="middle" letter-spacing="1">PRO FORM</text>

  <!-- Kinetic Drive Trajectory Line -->
  <path d="M 525 880 L 525 210" stroke="url(#orangeGlow)" stroke-width="6" stroke-dasharray="10 8" filter="url(#glowEffect)"/>
  <!-- Trajectory Arrow Head -->
  <polygon points="525,180 515,215 535,215" fill="#fc5200" filter="url(#glowEffect)"/>

  <!-- Athletic Figure Silhouette & Illustration -->
  <!-- Left Leg (Support) -->
  <path d="M 460 630 L 440 760 L 430 890 L 380 915 L 450 915 L 465 770 L 480 640 Z" fill="#182030" stroke="#2a354c" stroke-width="2"/>
  
  <!-- Right Leg (Working Drive) -->
  <path d="M 540 630 L 560 760 L 570 890 L 620 915 L 550 915 L 535 770 L 520 640 Z" fill="#1c2538" stroke="#323f5b" stroke-width="2"/>

  <!-- Shoes -->
  <path d="M 380 915 L 450 915 L 450 895 L 415 890 Z" fill="#fc5200"/>
  <path d="M 550 915 L 620 915 L 600 890 L 565 895 Z" fill="#fc5200"/>

  <!-- Athletic Shorts -->
  <path d="M 440 520 L 560 520 L 575 640 L 520 645 L 500 560 L 480 645 L 425 640 Z" fill="#101522" stroke="#252f44" stroke-width="2"/>

  <!-- Torso & Athletic Shirt -->
  <path d="M 450 360 L 550 360 L 560 530 L 440 530 Z" fill="url(#suitDark)" stroke="#2b364e" stroke-width="2"/>
  
  <!-- Head & Neck -->
  <path d="M 485 365 L 485 320 L 515 320 L 515 365 Z" fill="url(#bodySkin)"/>
  <!-- Head Profile looking slightly up -->
  <ellipse cx="500" cy="275" rx="35" ry="45" fill="url(#bodySkin)"/>
  <path d="M 470 260 Q 500 230 530 255 Q 535 285 525 300 Q 480 300 470 260 Z" fill="#1b1c20"/>

  <!-- Left Arm (Non-working, Out for Balance) -->
  <path d="M 450 365 L 360 410 L 310 460" stroke="url(#bodySkin)" stroke-width="32" stroke-linecap="round"/>
  <circle cx="310" cy="460" r="16" fill="url(#bodySkin)"/>

  <!-- Right Arm (Pressing Arm - Straight Locked Out Overhead) -->
  <!-- Shoulder to Elbow to Wrist to Overhead -->
  <path d="M 545 365 L 540 270 L 535 180" stroke="url(#bodySkin)" stroke-width="34" stroke-linecap="round"/>
  <!-- Hand gripping handle -->
  <circle cx="535" cy="175" r="18" fill="url(#bodySkin)"/>

  <!-- 12kg Kettlebell Overhead -->
  <g transform="translate(535, 125)">
    <!-- Bell Glow -->
    <circle cx="0" cy="0" r="48" fill="url(#orangeGlow)" opacity="0.3" filter="url(#glowEffect)"/>
    <!-- Kettlebell Body -->
    <circle cx="0" cy="0" r="44" fill="url(#bellMetal)" stroke="#718096" stroke-width="2"/>
    <!-- 12kg Label -->
    <text x="0" y="8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">12kg</text>
    <!-- Handle -->
    <path d="M -22 30 L -22 62 Q 0 74 22 62 L 22 30" fill="none" stroke="#718096" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- FORM CALLOUTS -->
  <!-- Callout 1: Lockout Overhead -->
  <g>
    <circle cx="535" cy="125" r="5" fill="#fc5200" filter="url(#glowEffect)"/>
    <polyline points="535,125 660,125 720,150" fill="none" stroke="#fc5200" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="710" y="130" width="220" height="52" rx="8" fill="#121a2c" stroke="rgba(252,82,0,0.5)" stroke-width="1.5"/>
    <text x="725" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">LOCKED OVERHEAD</text>
    <text x="725" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Arm bisecting ear · wrist straight</text>
  </g>

  <!-- Callout 2: Core & Ribs -->
  <g>
    <circle cx="490" cy="460" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <polyline points="490,460 340,460 280,480" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="70" y="460" width="220" height="52" rx="8" fill="#121a2c" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
    <text x="85" y="482" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">LOCKED-IN CORE</text>
    <text x="85" y="500" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Ribs pulled down · no lumbar arch</text>
  </g>

  <!-- Callout 3: Kinetic Hip Drive -->
  <g>
    <circle cx="500" cy="620" r="5" fill="#fc5200" filter="url(#glowEffect)"/>
    <polyline points="500,620 650,620 720,640" fill="none" stroke="#fc5200" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="710" y="620" width="220" height="52" rx="8" fill="#121a2c" stroke="rgba(252,82,0,0.5)" stroke-width="1.5"/>
    <text x="725" y="642" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">LEG &amp; HIP DIP-DRIVE</text>
    <text x="725" y="660" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">2-inch dip then explosive drive up</text>
  </g>

  <!-- Callout 4: Feet Grounding -->
  <g>
    <circle cx="585" cy="915" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <polyline points="585,915 680,915 720,870" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="710" y="850" width="220" height="52" rx="8" fill="#121a2c" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
    <text x="725" y="872" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">SOLID BASE</text>
    <text x="725" y="890" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Shoulder-width · rooted into floor</text>
  </g>

</svg>
